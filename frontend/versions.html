<!DOCTYPE html>
<html>
<head>
    <title>Asset Versions - Game Asset Pipeline System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- Display the asset version management page title -->
    <h1>Asset Version Management</h1>
<!-- Provide controls for uploading and recording a new asset version -->
    <h2>Add New Version</h2>

    <label>Select Asset:</label>
<select id="assetId">
    <option value="">Choose an asset</option>
</select>
    <br><br>

    <label>Version Number:</label>
    <input type="number" id="versionNumber">
    <br><br>

    <label>Version File:</label>
<input type="file" id="versionFile">
    <br><br>

    <label>Notes:</label>
    <input type="text" id="notes">
    <br><br>

    <button id="addVersionButton">Add Version</button>
<button onclick="viewSelectedVersions()">
    View Versions
</button>
<!-- Display the version history of the selected asset -->
    <h2>Version History</h2>

    <div id="versionList" class="version-timeline"></div>
<script>
    // Check whether the user is logged in before allowing access to Version Management
    const storedUserRole = localStorage.getItem('userRole');

if (!storedUserRole) {
    window.location.href = '/login.html';
}
// Retrieve available assets from the backend for the asset selection list
fetch('/assets')
    .then(response => response.json())
    .then(assets => {
        const assetSelect = document.getElementById('assetId');

        assets.forEach(asset => {
            const option = document.createElement('option');

            option.value = asset.Asset_ID;
            option.textContent = asset.Asset_Name;

            assetSelect.appendChild(option);
        });
    });
    // Handle the creation of a new version for the selected asset
document.getElementById('addVersionButton').addEventListener('click', async function() {
    const assetId = document.getElementById('assetId').value;
    const versionNumber = document.getElementById('versionNumber').value;
    const versionFile = document.getElementById('versionFile').files[0];
    const notes = document.getElementById('notes').value;
    if (!versionFile) {
    alert('Please choose a version file.');
    return;
}
// Prepare and upload the selected version file to the backend
const formData = new FormData();
formData.append('versionFile', versionFile);

const uploadResponse = await fetch('/upload-version-file', {
    method: 'POST',
    body: formData
});

const uploadResult = await uploadResponse.json();

if (!uploadResponse.ok) {
    alert(uploadResult.message || 'File upload failed');
    return;
}

const filePath = uploadResult.filePath;
// Save the new version details and uploaded file path in the database
    const response = await fetch(`/assets/${assetId}/versions`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            versionNumber,
            filePath,
            notes
        })
    });

    const result = await response.json();
    alert(result.message);
});
// Load the version history for the asset selected by the user
function viewSelectedVersions() {
    const assetId = document.getElementById('assetId').value;

    if (!assetId) {
        alert('Please select an asset first.');
        return;
    }

    loadVersions(assetId);
}
// Retrieve and display the stored version history for the selected asset
async function loadVersions(assetId) {
    const response = await fetch(`/assets/${assetId}/versions`);
    const versions = await response.json();
    // Automatically suggest the next version number based on the current highest version
    if (versions.length > 0) {
    const highestVersion = Math.max(
        ...versions.map(version => Number(version.Version_Number))
    );

    document.getElementById('versionNumber').value = highestVersion + 1;
} else {
    document.getElementById('versionNumber').value = 1;
}

    const versionList = document.getElementById('versionList');
    versionList.innerHTML = '';
// Display each version and determine the appropriate preview based on its file type
   versions.forEach((version, index) => {
    const filePath = version.File_Path || '';
    const isImage = /\.(png|jpg|jpeg|webp)$/i.test(filePath);
    const isObj = /\.obj$/i.test(filePath);
    const isAudio = /\.(mp3|wav)$/i.test(filePath);
const isDocument = /\.(pdf|doc|docx|txt)$/i.test(filePath);

    versionList.innerHTML += `
        <div class="version-card">

            <div class="version-preview">
               ${
    isImage
    ? `<img src="${filePath}" alt="Version ${version.Version_Number} preview">`
    : isObj
        ? `<div class="version-placeholder version-placeholder-obj">
               <div class="file-type-large">3D</div>
               <div>OBJ Model</div>
          </div>`
        : isAudio
            ? `<div class="version-placeholder version-placeholder-audio">
                   <div class="file-type-large">AUDIO</div>
                   <div>Sound File</div>
              </div>`
            : isDocument
                ? `<div class="version-placeholder version-placeholder-document">
                       <div class="file-type-large">DOC</div>
                       <div>Document</div>
                  </div>`
                : `<div class="version-placeholder">Preview not available</div>`
}
            </div>

            <div class="version-info">
                <!-- Highlight the most recent asset version as the current version -->
               <h3>
    Version ${version.Version_Number}

    ${index === 0 ? '<span class="current-version-badge">CURRENT</span>' : ''}
</h3>
                <p><strong>File:</strong> ${version.File_Path}</p>
                <p><strong>Notes:</strong> ${version.Notes || 'No notes'}</p>
                <p><strong>Created:</strong> ${new Date(version.Created_At).toLocaleString('en-GB')}</p>
            </div>

        </div>
    `;
});
}
</script>
</body>
</html>
