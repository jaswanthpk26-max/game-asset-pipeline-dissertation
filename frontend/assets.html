<!DOCTYPE html>
<html>
<head>
    <title>Assets - Game Asset Pipeline System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-header">
    <h1>Asset Library</h1>
    <p>Manage production assets, versions and workflow stages.</p>
</div>

<div class="asset-panel">
    <h2>Add New Asset</h2>
<form id="assetForm">
    <label>Asset Name:</label>
    <input type="text" id="assetName">
    <br><br>

<label>Asset Type:</label>
<select id="assetType">
    <option value="3D Model">3D Model</option>
    <option value="Texture">Texture</option>
    <option value="Audio">Audio</option>
    <option value="Document">Document</option>
</select>

<br><br>

<label>File Path:</label>
<input type="text" id="filePath">
<br><br>
<label>Preview Image:</label>
<input type="file" id="previewFile" accept="image/*">
<label>Status:</label>
<select id="assetStatus">
    <option value="Draft">Draft</option>
    <option value="In Progress">In Progress</option>
    <option value="Review">Review</option>
    <option value="Final">Final</option>
</select>

<br><br>

<button type="submit">Add Asset</button>

</form>
</div>
<div class="asset-panel">
    <h2>Search and Filter</h2>
<label>Search Assets:</label>
<input type="text" id="searchInput" placeholder="Search by asset name">
<br><br>

<label>Filter by Type:</label>
<select id="typeFilter">
    <option value="All">All Types</option>
    <option value="3D Model">3D Model</option>
    <option value="Texture">Texture</option>
    <option value="Audio">Audio</option>
    <option value="Document">Document</option>
</select>
</div>
    <div id="assetList"></div>
<script>
    const storedUserRole = localStorage.getItem('userRole');

    if (!storedUserRole) {
        window.location.href = '/login.html';
    }
    document.getElementById('assetForm').addEventListener('submit', async function(event) {
    event.preventDefault();

    const assetName = document.getElementById('assetName').value;
    const assetType = document.getElementById('assetType').value;
    const filePath = document.getElementById('filePath').value;
    const status = document.getElementById('assetStatus').value;
    const previewFile = document.getElementById('previewFile').files[0];
    let previewPath = null;

if (previewFile) {
    const previewFormData = new FormData();
    previewFormData.append('previewFile', previewFile);

    const previewUploadResponse = await fetch('/upload-preview', {
        method: 'POST',
        body: previewFormData
    });

    const previewUploadResult = await previewUploadResponse.json();
    previewPath = previewUploadResult.previewPath;
}
    const response = await fetch('/assets', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify({
        assetName,
        assetType,
        filePath,
        previewPath,
        status
    })
});
const result = await response.json();
alert(result.message);
location.reload();
});
fetch('/assets')
    .then(response => response.json())
    .then(assets => {
        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');

function applyFilters() {
    const searchText = searchInput.value.toLowerCase();
    const selectedType = typeFilter.value;

    const filteredAssets = assets.filter(asset => {
        const matchesSearch =
            asset.Asset_Name.toLowerCase().includes(searchText);

        const matchesType =
            selectedType === 'All' ||
            asset.Asset_Type === selectedType;

        return matchesSearch && matchesType;
    });

    displayAssets(filteredAssets);
}

searchInput.addEventListener('input', applyFilters);
typeFilter.addEventListener('change', applyFilters);
   function displayAssets(assetArray) {
    document.getElementById('assetList').innerHTML = '';

    assetArray.forEach(asset => {
        document.getElementById('assetList').innerHTML += `
           <div class="asset-card">
    <div class="asset-card-top">
        <div>
            <span class="asset-type-badge">${asset.Asset_Type}</span>
            <h2>${asset.Asset_Name}</h2>
        </div>

        <span class="status-badge status-${asset.Status.replace(' ', '-').toLowerCase()}">
            ${asset.Status}
        </span>
    </div>
<div class="asset-preview">
    ${
        /^\/uploads\/.+\.(png|jpg|jpeg|webp)$/i.test(asset.Preview_Path || '')
        ? `<img
       src="${asset.Preview_Path}"
       alt="${asset.Asset_Name} preview"
       onclick="openPreview('${asset.Preview_Path}', '${asset.Asset_Name}')"
       style="cursor: pointer;"
   >`
        : `<div class="asset-preview-placeholder">${asset.Asset_Type}</div>`
    }
</div>
    <div class="asset-meta">
        <p><strong>File</strong><br>${asset.File_Path}</p>
        <p><strong>Last Updated</strong><br>${new Date(asset.Last_Updated).toLocaleString()}</p>
    </div>
    ${storedUserRole === 'Administrator' ? `
    <div class="asset-actions">
        <button
            class="delete-asset-button"
            onclick="deleteAsset(${asset.Asset_ID})">
            Delete Asset
        </button>
    </div>
` : ''}
</div>
        `;
    });
}

displayAssets(assets);
    });
    function openPreview(imagePath, assetName) {
    document.getElementById('previewLargeImage').src = imagePath;
    document.getElementById('previewTitle').textContent = assetName;
    document.getElementById('previewModal').style.display = 'flex';
}

function closePreview() {
    document.getElementById('previewModal').style.display = 'none';
}
async function deleteAsset(assetId) {
    const confirmed = confirm(
        'Are you sure you want to permanently delete this asset? Its versions and activity history will also be removed.'
    );

    if (!confirmed) {
        return;
    }

    try {
        const response = await fetch(`/assets/${assetId}`, {
            method: 'DELETE'
        });

        const result = await response.json();

        if (response.ok) {
            alert('Asset deleted successfully.');
            location.reload();
        } else {
            alert(result.message || 'Failed to delete asset.');
        }
    } catch (error) {
        console.error(error);
        alert('An error occurred while deleting the asset.');
    }
}
</script>
<div id="previewModal" class="preview-modal" onclick="closePreview()">

    <div class="preview-modal-content" onclick="event.stopPropagation()">

        <button class="preview-close" onclick="closePreview()">×</button>

        <h2 id="previewTitle">Asset Preview</h2>

        <img id="previewLargeImage" src="" alt="Large asset preview">

    </div>

</div>
</body>
</html>
