<!DOCTYPE html>
<html>
<head>
    <title>Projects - Game Asset Pipeline System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Projects</h1>

    <div id="projectList"></div>
<script>
    const storedUserRole = localStorage.getItem('userRole');

if (!storedUserRole) {
    window.location.href = '/login.html';
}
fetch('/projects')
    .then(response => response.json())
    .then(projects => {
        projects.forEach(project => {
    document.getElementById('projectList').innerHTML += `
    <div class="project-card">

        <div class="project-card-header">
            <div>
                <span class="project-label">GAME PRODUCTION PROJECT</span>
                <h2>${project.Project_Name}</h2>
            </div>

            <span class="project-status">${project.Status}</span>
        </div>

        <p class="project-description">
            ${project.Description}
        </p>

        <div class="project-meta">
            <div>
                <span>Project Status</span>
                <strong>${project.Status}</strong>
            </div>

            <div>
                <span>Production System</span>
                <strong>Asset Pipeline</strong>
            </div>
        </div>

        <button class="project-open-button"
            onclick="window.location.href='/assets.html'">
            View Project Assets
        </button>

    </div>
`;
});
    });
</script>
</body>
</html>
