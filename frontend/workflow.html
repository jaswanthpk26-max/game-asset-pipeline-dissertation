<!DOCTYPE html>
<html>
<head>
    <title>Workflow - Game Asset Pipeline System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- Display the visual production workflow page title and description -->
   <div class="page-header">
    <h1>Visual Production Workflow</h1>
    <p>Track game assets across each stage of the production pipeline.</p>
</div>
<!-- Organise assets into Draft, In Progress, Review and Final workflow stages -->
<div class="workflow-board">

    <div class="workflow-column draft-column">
        <div class="workflow-column-header">
            <h2>Draft</h2>
            <span>Initial Stage</span>
        </div>
        <div id="draftList" class="workflow-list"></div>
    </div>

    <div class="workflow-column progress-column">
        <div class="workflow-column-header">
            <h2>In Progress</h2>
            <span>Production</span>
        </div>
        <div id="progressList" class="workflow-list"></div>
    </div>

    <div class="workflow-column review-column">
        <div class="workflow-column-header">
            <h2>Review</h2>
            <span>Approval Stage</span>
        </div>
        <div id="reviewList" class="workflow-list"></div>
    </div>

    <div class="workflow-column final-column">
        <div class="workflow-column-header">
            <h2>Final</h2>
            <span>Completed</span>
        </div>
        <div id="finalList" class="workflow-list"></div>
    </div>

</div>
    <script>
        // Check whether the user is logged in before allowing access to the Visual Workflow
        const storedUserRole = localStorage.getItem('userRole');

if (!storedUserRole) {
    window.location.href = '/login.html';
}
// Retrieve all assets from the backend for display in the workflow board
fetch('/assets')
    .then(response => response.json())
    .then(assets => {
        // Assign each asset to the correct workflow column based on its current status
        assets.forEach(asset => {

    let targetList;

    if (asset.Status === 'Draft') {
        targetList = 'draftList';
    } else if (asset.Status === 'In Progress') {
        targetList = 'progressList';
    } else if (asset.Status === 'Review') {
        targetList = 'reviewList';
    } else if (asset.Status === 'Final') {
        targetList = 'finalList';
    }
    // Display the asset information and controls inside its assigned workflow column
if (targetList) {
    document.getElementById(targetList).innerHTML += `
        <div>
            <h3>${asset.Asset_Name}</h3>

<div class="asset-meta">
    <span class="asset-type-badge">${asset.Asset_Type}</span>
    <span class="status-badge">${asset.Status}</span>
</div>
<div class="workflow-preview">
    ${
        /^\/uploads\/.+\.(png|jpg|jpeg|webp)$/i.test(asset.Preview_Path || '')
        ? `<img src="${asset.Preview_Path}" alt="${asset.Asset_Name} preview">`
        : `<div class="workflow-preview-placeholder">${asset.Asset_Type}</div>`
    }
</div>
<p class="updated-time">
    Last Updated:
    ${asset.Last_Updated
        ? new Date(asset.Last_Updated).toLocaleString('en-GB')
        : 'Not available'}
</p>
            <select id="status-${asset.Asset_ID}">
   <option value="Draft" ${asset.Status === 'Draft' ? 'selected' : ''}>Draft</option>
<option value="In Progress" ${asset.Status === 'In Progress' ? 'selected' : ''}>In Progress</option>
<option value="Review" ${asset.Status === 'Review' ? 'selected' : ''}>Review</option>
<option value="Final" ${asset.Status === 'Final' ? 'selected' : ''}>Final</option>
</select>

<button onclick="updateStatus(${asset.Asset_ID})">
    Update Status
</button>
<!-- Show approval controls only to Administrator and Project Manager roles during Review -->
${asset.Status === 'Review' && 
  (localStorage.getItem('userRole') === 'Administrator' ||
   localStorage.getItem('userRole') === 'Project Manager') ? `
    <button onclick="approveAsset(${asset.Asset_ID})">Approve</button>
    <button onclick="rejectAsset(${asset.Asset_ID})">Reject</button>
` : ''}
        </div>
    `;
}
});
    });
// Update the selected asset's workflow status and save the change through the backend
    async function updateStatus(assetId) {
    const status = document.getElementById(`status-${assetId}`).value;

    const response = await fetch(`/assets/${assetId}/status`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ status })
    });

    const result = await response.json();
    alert(result.message);

    location.reload();
}
// Approve the selected asset by moving it from Review to the Final workflow stage
async function approveAsset(assetId) {
    const response = await fetch(`/assets/${assetId}/status`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ status: 'Final' })
    });

    const result = await response.json();
    alert('Asset approved successfully');

    location.reload();
}
// Reject the selected asset by returning it from Review to the In Progress stage
async function rejectAsset(assetId) {
    const response = await fetch(`/assets/${assetId}/status`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ status: 'In Progress' })
    });

    const result = await response.json();
    alert('Asset rejected and returned to In Progress');

    location.reload();
}
</script>

</body>
</html>
