<!DOCTYPE html>
<html>
<head>
    <title>Notifications - Game Asset Pipeline System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- Display the notifications page and notification testing controls -->
    <h1>Notifications</h1>
    <h2>Create Test Notification</h2>
<!-- Allow a test notification message to be created -->
<input type="text" id="messageInput" placeholder="Enter notification message">

<button id="createNotificationButton">
    Create Notification
</button>

<br><br>

    <div id="notificationList"></div>
<script>
    // Check whether the user is logged in before allowing access to notifications
    const storedUserRole = localStorage.getItem('userRole');

if (!storedUserRole) {
    window.location.href = '/login.html';
}
// Create a new test notification when the button is clicked
    document.getElementById('createNotificationButton').addEventListener('click', async function() {
    const message = document.getElementById('messageInput').value;

    const response = await fetch('/notifications', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            userId: 1,
            message: message
        })
    });

    const result = await response.json();
    alert(result.message);

    location.reload();
});
// Retrieve the user's notifications from the backend for display
fetch('/notifications/1')
    .then(response => response.json())
    .then(notifications => {
        // Display each notification with its message, date and read status
       notifications.forEach(notification => {
    document.getElementById('notificationList').innerHTML += `
        <p>${notification.Message}</p>
        <p>Status: ${notification.Is_Read ? 'Read' : 'Unread'}</p>
        <small>${notification.Created_At}</small>
        <br>
        ${notification.Is_Read
    ? '<span>Already Read</span>'
    : `<button onclick="markAsRead(${notification.Notification_ID})">Mark as Read</button>`
}
        <hr>
    `;
});
    });
    // Mark the selected notification as read in the database
    async function markAsRead(notificationId) {
    const response = await fetch(`/notifications/${notificationId}/read`, {
        method: 'PUT'
    });

    const result = await response.json();

    alert(result.message);
    location.reload();
}
</script>
</body>
</html>
